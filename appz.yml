    app:
        name: MySQL
        code: mysql
        #notify: appzdev@cloudbourne.co

    build:
        version: 8.0
        env: DEV
        build_file: none
        output_files: output/*.zip
        image_template: mysql-8.0

    deploy:
        context: nithinc-cloud/DEV
        type: statefulset
        replicas: 1
        resources: x-large
        ingress: none
        port:
        - 3306

    volumes:
      - claim: mysql-data
        mount: /var/lib/mysql
        name: data
        size: 5Gi
      - claim: mysql-backup
        mount: /appz/backup
        name: backup
        size: 5Gi

    properties:
        ENABLE_BACKUP_METRICS: 1
        BACKUP_RETENTION: 5
        MYSQL_DISABLE_LOG_BIN: 1
        BINLOG_EXPIRE_LOGS_SECONDS: 3600
        MYSQL_ROOT_PASSWORD:
          vault: MYSQL_ROOT_PASSWORD_KEY
        MYSQL_TRACKER_PASSWORD:
          vault: MYSQL_TRACKER_PASSWORD
        MYSQL_ECLOUDCONTROL_PASSWORD:
          vault: MYSQL_ECLOUDCONTROL_PASSWORD
        revision : 43

